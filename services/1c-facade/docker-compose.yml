# Запуск (из каталога сервиса — тогда compose сам подхватит docker-compose.override.yml):
#   cd services/1c-facade && docker compose up -d --build
#
# Контекст сборки — корень репозитория: в образ едет и сервис, и чекер правил.
services:
  facade:
    build:
      context: ../..
      dockerfile: services/1c-facade/Dockerfile
    image: 1c-facade:local
    container_name: 1c_facade
    restart: unless-stopped

    # Только на петлю. Своей аутентификации у фасада нет, а через него читается
    # исходный код всех зарегистрированных конфигураций — наружу не выставлять.
    ports:
      - "127.0.0.1:8770:8770"

    # Бэкенды живут в своих compose-стеках. Подключение к их сетям даёт
    # адресацию по имени контейнера и внутреннему порту — пробрасывать порты
    # на хост ради фасада не нужно, и не важно, проброшены ли они вообще.
    # host.docker.internal остаётся для бэкендов вне docker (например rlm).
    # Сами сети — в docker-compose.override.yml.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Реестр проектов. Пути внутри него — контейнерные (см. монтирования в override).
      - ./facade-registry.json:/etc/facade/registry.json:ro

      # Выгрузки и сети бэкендов — машинные, живут в docker-compose.override.yml
      # (вне git, образец — docker-compose.override.example.yml).

      # Отметки последнего обращения для LRU. Именованный том, чтобы переживать
      # пересоздание контейнера.
      - facade-state:/var/lib/facade

      # ⚠ Сокет демона: нужен ТОЛЬКО если фасад должен поднимать остановленные
      # бэкенды сам (cold_ok в реестре). Это доступ к демону хоста, равносильный
      # root на хосте. Без него фасад полностью рабочий — просто сообщает
      # состояние unknown вместо того, чтобы запускать контейнеры.
      # - /var/run/docker.sock:/var/run/docker.sock

    environment:
      FACADE_REGISTRY: /etc/facade/registry.json
      FACADE_STATE: /var/lib/facade/state.json
      FACADE_CHECK_CMD: "python /app/rules-check/rules_check.py"

    # Внутрь ничего не пишется, кроме тома состояния.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  facade-state:
