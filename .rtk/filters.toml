# Project-local RTK filters — commit this file with your repo.
# Filters here override user-global and built-in filters.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
schema_version = 1

# Example: suppress build noise from a custom tool
# [filters.my-tool]
# description = "Compact my-tool output"
# match_command = "^my-tool\\s+build"
# strip_ansi = true
# strip_lines_matching = ["^\\s*$", "^Downloading", "^Installing"]
# max_lines = 30
# on_empty = "my-tool: ok"

# 1C validators (overlay scripts): drop the OK noise, keep WARN/ERR + result
[filters.onec-validate]
description = "1C validate scripts: keep WARN/ERR and the result line"
match_command = "(role|form|meta|cf|cfe|skd|subsystem|epf|mxl|interface)-validate\\.ps1"
strip_ansi = true
strip_lines_matching = ["^\\s{2}OK\\s", "^\\s*$", "^Validating:"]
max_lines = 40
on_empty = "validation: all OK"
