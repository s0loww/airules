# Карта tier -> модель по каналам.
#
# Единственное место в core, где допустимы имена конкретных моделей. Роль
# несёт tier (см. core/agents/ROLES.md), инсталлятор резолвит модель канала
# по tier при раскладке дистрибутива в целевой проект. Для каналов без
# устоявшегося стандарта модели значения-плейсхолдеры {{...}} — их
# запрашивают у пользователя на установке и подставляют вместо плейсхолдера.

tiers: [high, medium, low]        # + опциональный override-тир fast (см. ROLES.md)

channels:
  claude:
    high:   opus
    medium: sonnet
    low:    haiku
    # fast не определён: роли с override=fast работают на своём базовом tier
    orchestrator: fable
    # orchestrator — НЕ тир ролей: это класс модели головного агента. Если
    # сессия идёт на модели этого тира, автоматически включается режим
    # экономии (core/rules/orchestrator-economy.md): исполнение — субагентам
    # на канальных тирах, оркестратору — решения и сверка.

  codex:
    # Семейство GPT-5.6 (GA 2026-07, подписочный доступ в Codex):
    # sol — флагман, terra — качество класса gpt-5.5 за полцены, luna —
    # самый быстрый/дешёвый. Замещает gpt-5.5/5.4/5.4-mini/5.3-codex-spark.
    high:   { model: gpt-5.6-sol, reasoning: high }
    medium: { model: gpt-5.6-terra, reasoning: medium }
    low:    { model: gpt-5.6-luna, reasoning: low }
    fast:   { model: gpt-5.6-luna, reasoning: low }
    # fast намеренно совпадает с low: выделенной speed-модели в семействе
    # нет; override fast сохраняет экономию для error-fixer (base medium).
    orchestrator: gpt-5.6-sol
    # orchestrator — класс головного агента (оркестрирует на уровне
    # fable-класса); сессия на этой модели включает режим экономии
    # (core/rules/orchestrator-economy.md), как и claude.orchestrator.
    # Максимальный reasoning-тир канала выдаётся только вручную, как
    # эскалация по явному решению пользователя на конкретную задачу.

  cursor:
    high:   "{{CURSOR_MODEL_HIGH}}"
    medium: "{{CURSOR_MODEL_MEDIUM}}"
    low:    "{{CURSOR_MODEL_LOW}}"

  other:
    high:   "{{MODEL_HIGH}}"
    medium: "{{MODEL_MEDIUM}}"
    low:    "{{MODEL_LOW}}"

# Правило резолва: взять tier роли из core/agents/ROLES.md -> найти
# channels.<канал>.<tier> -> получить модель. Значение-плейсхолдер {{...}}
# означает подстановку ответа пользователя вместо него. Канал может
# определить override-тир fast — тогда роли с override=fast получают его.
