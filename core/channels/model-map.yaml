# Карта tier -> модель и effort роли -> effort канала.
#
# Единственное место в core, где допустимы имена конкретных моделей. Роль
# несёт tier и effort (см. core/agents/ROLES.md), инсталлятор резолвит модель
# и усилие канала при раскладке дистрибутива в целевой проект. Для каналов без
# устоявшегося стандарта модели значения-плейсхолдеры {{...}} — их
# запрашивают у пользователя на установке и подставляют вместо плейсхолдера.

tiers: [high, medium, low]        # + опциональный override-тир fast (см. ROLES.md)
efforts: [low, medium, high, xhigh]
# Канало-нейтральная шкала усилия. Верхняя ступень канала (там, где она есть)
# в шкалу НЕ входит: она выдаётся только вручную, как эскалация на конкретную
# задачу. Причина не в цене: на верхней ступени результат ниже, чем на xhigh,
# при большей стоимости — это потеря, а не размен.

channels:
  claude:
    high:   opus
    medium: sonnet
    low:    haiku
    # fast не определён: роли с override=fast работают на своём базовом tier
    orchestrator: opus
    # orchestrator — НЕ тир ролей: это класс модели головного агента. Здесь он
    # СОВПАДАЕТ с high: головной агент и тяжёлый исполнитель — одна модель.
    # Следствие: автовключение режима экономии
    # (core/rules/orchestrator-economy.md) на этом канале НЕ работает —
    # автотриггеру нужен класс выше high, а его тут нет. Режим остаётся
    # доступным вручную (`Оркестрация: economy`).
    effort:
      low:    low
      medium: medium
      high:   high
      xhigh:  xhigh
    # Модель fable-класса из дефолтной раскладки убрана и вызывается вручную,
    # по показаниям: многодневная задача, границы работы заранее неизвестны,
    # нужно, чтобы модель сама определяла следующие шаги, плюс работа с
    # памятью между прогонами. Во всех прочих случаях — тиры выше.
    # Профиль поведения для неё остаётся в model-profiles.md и применяется,
    # если пользователь выбрал её явно.

  codex:
    # Семейство GPT-5.6 (GA 2026-07, подписочный доступ в Codex):
    # sol — флагман, terra — качество класса gpt-5.5 за полцены, luna —
    # самый быстрый/дешёвый. Замещает gpt-5.5/5.4/5.4-mini/5.3-codex-spark.
    high:   { model: gpt-5.6-sol, reasoning: high }
    medium: { model: gpt-5.6-terra, reasoning: medium }
    low:    { model: gpt-5.6-luna, reasoning: low }
    fast:   { model: gpt-5.6-luna, reasoning: low }
    # fast намеренно совпадает с low: выделенной speed-модели в семействе
    # нет; override fast сохраняет экономию для error-fixer (base medium).
    orchestrator: gpt-5.6-sol
    # orchestrator — класс головного агента, здесь он ВЫШЕ канальных тиров по
    # стоимости токена, поэтому автовключение режима экономии
    # (core/rules/orchestrator-economy.md) на этом канале работает: расход
    # считается по счёту, а не по подписке.
    effort:
      low:    low
      medium: medium
      high:   high
      xhigh:  high
      # У семейства нет ступени выше high: xhigh роли схлопывается в high.
      # Поле reasoning в тирах выше — фолбэк для агентов вне реестра ролей
      # (оверлейные определения без колонки effort).

  cursor:
    high:   "{{CURSOR_MODEL_HIGH}}"
    medium: "{{CURSOR_MODEL_MEDIUM}}"
    low:    "{{CURSOR_MODEL_LOW}}"
    # effort не определён: канал не даёт управления усилием — колонка effort
    # роли при раскладке игнорируется.

  other:
    high:   "{{MODEL_HIGH}}"
    medium: "{{MODEL_MEDIUM}}"
    low:    "{{MODEL_LOW}}"
    # effort не определён — см. пометку у cursor.

# Правило резолва модели: взять tier роли из core/agents/ROLES.md -> найти
# channels.<канал>.<tier> -> получить модель. Значение-плейсхолдер {{...}}
# означает подстановку ответа пользователя вместо него. Канал может
# определить override-тир fast — тогда роли с override=fast получают его.
#
# Правило резолва усилия: взять effort роли из core/agents/ROLES.md -> найти
# channels.<канал>.effort.<значение> -> получить значение канала. Если канал
# секцию effort не определяет — усилие не выставляется вообще (у канала нет
# такого управления). Роль без колонки effort получает фолбэк тира, если
# канал его несёт (codex: поле reasoning), иначе — дефолт сессии.
