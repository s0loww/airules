# Карта tier -> модель и effort роли -> effort сессии.
#
# Единственное место в core, где допустимы имена конкретных моделей. Роль
# несёт tier и effort (см. core/agents/ROLES.md), инсталлятор резолвит модель
# и усилие при раскладке дистрибутива в целевой проект.

tiers: [high, medium, low]        # + опциональный override-тир fast (см. ROLES.md)
efforts: [low, medium, high, xhigh]
# Шкала усилия. Верхняя ступень (там, где она есть) в шкалу НЕ входит: она
# выдаётся только вручную, как эскалация на конкретную задачу. Причина не в
# цене: на верхней ступени результат ниже, чем на xhigh, при большей
# стоимости — это потеря, а не размен.

claude:
  high:   opus
  medium: sonnet
  low:    haiku
  # fast не определён: роли с override=fast работают на своём базовом tier
  orchestrator: opus
  # orchestrator — НЕ тир ролей: это класс модели головного агента. Здесь он
  # СОВПАДАЕТ с high: головной агент интерактивной работы и тяжёлый
  # исполнитель — одна модель. Режим оркестрации поэтому сам не включается —
  # его включает команда сессии (core/rules/orchestrator-economy.md).
  effort:
    low:    low
    medium: medium
    high:   high
    xhigh:  xhigh

# Головной агент. Модель основной сессии выбирает пользователь, раскладка её
# не назначает; ниже — рекомендуемые пары и основание.
#   интерактивная работа       — тир high на усилии high: ловит связи области
#                                применения и кладёт их в карту влияния;
#   длинный автономный прогон  — модель fable-класса на усилии medium (многие
#                                сутки одной сессией, сама закрывает развилки;
#                                выше medium у неё растёт доля ложных
#                                утверждений). В раскладку ролей она не входит:
#                                её выбирают вручную, профиль поведения — в
#                                model-profiles.md.
lead:
  interactive: { tier: high, effort: high }
  autonomous:  { class: fable, effort: medium }

# Режим оркестрации (core/rules/orchestrator-economy.md). Исполнитель основного
# потока, если команда сессии включила режим и не назвала исполнителя.
# Замер на реальной задаче: тот же тир на усилии high — плюс 70 % времени и
# токенов при том же покрытии связей.
orchestration:
  executor: { tier: high, effort: medium }
  # Работы с закреплённым тиром — команда сессии их не трогает:
  scripts: { tier: medium, effort: medium }   # скрипты, утилиты, обвязка тестов
  recon:   { tier: low,    effort: medium }   # разведка, поиск, карта подсистемы
  # Срок жизни кэша промпта субагента. По умолчанию у субагентов 5 минут:
  # любая команда дольше (выкатка, полный регресс) — и весь контекст агента
  # пишется в кэш заново. Ролям из списка ставится час (frontmatter
  # `experimental: { cacheTtl: 1h }`, Claude Code 2.1.248+); остальным час
  # только удорожает запись.
  long_cache_roles: [developer, metadata-manager, error-fixer, refactoring, tester]

# Правило резолва модели: взять tier роли из core/agents/ROLES.md -> найти
# claude.<tier> -> получить модель. Роль может нести override-тир fast — тогда
# берётся claude.fast, если он определён.
#
# Правило резолва усилия: взять effort роли из core/agents/ROLES.md -> найти
# claude.effort.<значение>. Роль без колонки effort получает дефолт сессии.
